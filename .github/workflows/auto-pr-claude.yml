name: Auto-open PR for Claude branches

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR if one doesn't already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BASE: master
        run: |
          set -uo pipefail

          echo "::group::Inputs"
          echo "BRANCH=$BRANCH"
          echo "BASE=$BASE"
          gh auth status || true
          echo "::endgroup::"

          echo "::group::Look for an existing open PR"
          # Use `// empty` so jq prints "" (not "null") when no PR exists.
          existing=$(gh pr list \
            --head "$BRANCH" --base "$BASE" --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)
          echo "existing PR number = '${existing:-<none>}'"
          echo "::endgroup::"

          if [ -n "${existing:-}" ]; then
            echo "PR #$existing already open for $BRANCH — nothing to do."
            exit 0
          fi

          echo "::group::Check commits ahead of $BASE"
          git fetch --no-tags origin "$BASE" "$BRANCH" 2>/dev/null || true
          ahead=$(git rev-list --count "origin/$BASE..origin/$BRANCH" 2>/dev/null || echo 0)
          echo "$ahead commits ahead of origin/$BASE"
          echo "::endgroup::"

          if [ "$ahead" -eq 0 ]; then
            echo "No commits ahead of $BASE; skipping PR creation."
            exit 0
          fi

          title=$(git log -1 --pretty=%s "origin/$BRANCH")
          body=$(printf 'Automated PR opened by the auto-pr workflow.\n\n## Commits\n\n%s\n' \
            "$(git log --pretty='* %h %s' "origin/$BASE..origin/$BRANCH")")

          echo "::group::Create PR"
          if ! gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$title" \
            --body "$body"
          then
            echo "::error::gh pr create failed. Likely causes:"
            echo "  1) Settings -> Actions -> General -> Workflow permissions"
            echo "     set to 'Read repository contents and packages permissions'"
            echo "     instead of 'Read and write permissions'."
            echo "  2) The same panel's 'Allow GitHub Actions to create and"
            echo "     approve pull requests' checkbox is not ticked."
            echo "  3) A closed/merged PR for $BRANCH still exists and is being"
            echo "     matched -- reopen it instead of opening a new one."
            exit 1
          fi
          echo "::endgroup::"
